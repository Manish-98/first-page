name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Check out or initialize Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              ../pages-deploy
          else
            mkdir ../pages-deploy
            cd ../pages-deploy
            git init
            git checkout --orphan gh-pages
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            touch .nojekyll
            git add .nojekyll
            git commit -m "deploy: initialize GitHub Pages branch"
          fi

      - name: Publish production site and preserve PR previews
        run: |
          set -euo pipefail
          cp -R dist/. ../pages-deploy/
          touch ../pages-deploy/.nojekyll
          cd ../pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Production site is already up to date."
            exit 0
          fi
          git commit -m "deploy: production ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
