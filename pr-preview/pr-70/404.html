<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="robots" content="noindex" />
    <title>Page not found · First Page</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #24251f;
        background: #f8f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        display: flex;
        min-width: 320px;
        min-height: 100vh;
        flex-direction: column;
        margin: 0;
        padding: 32px clamp(24px, 6vw, 88px) 24px;
      }

      header, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .wordmark {
        color: inherit;
        font-size: 1.25rem;
        font-weight: 750;
        letter-spacing: -0.07em;
        text-decoration: none;
      }

      .wordmark span, .eyebrow { color: #8b7659; }

      main {
        display: flex;
        width: 100%;
        flex: 1;
        align-items: center;
        justify-content: center;
      }

      .message {
        width: min(760px, 100%);
        margin: auto;
        padding: 88px 0;
      }

      .eyebrow {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      h1 {
        max-width: 720px;
        margin: 20px 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 7vw, 5.8rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .intro {
        max-width: 520px;
        color: #68675f;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .home-link {
        display: inline-block;
        margin-top: 24px;
        border: 1px solid #dedbd2;
        border-radius: 999px;
        padding: 11px 16px;
        color: #68675f;
        font-size: 0.88rem;
        font-weight: 600;
        text-decoration: none;
      }

      .home-link:hover { color: #8b7659; }

      footer {
        border-top: 1px solid #e7e4dc;
        padding-top: 18px;
        color: #77766e;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }

      :focus-visible {
        outline: 3px solid #8b7659;
        outline-offset: 4px;
      }

      @media (max-width: 560px) {
        body { padding: 24px 20px 20px; }
        .message { padding: 64px 0; }
        footer { align-items: flex-start; flex-direction: column; gap: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="wordmark" href="/first-page/" aria-label="First Page home">first<span>.</span>page</a>
    </header>
    <main id="main-content">
      <section class="message" aria-labelledby="not-found-title">
        <p class="eyebrow">404 · PAGE NOT FOUND</p>
        <h1 id="not-found-title">This page isn’t here.</h1>
        <p class="intro">
          The address may be incorrect, or the page may have moved. Let’s get
          you back to a fresh start.
        </p>
        <a class="home-link" href="/first-page/">Return to First Page</a>
      </section>
    </main>
    <footer>
      <span>First Page</span>
      <span>Your CV, thoughtfully made.</span>
    </footer>
  </body>
</html>
